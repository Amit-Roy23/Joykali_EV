<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d47a1" />
<title>No internet · Joykali EV</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: linear-gradient(160deg, #0d47a1, #1976c0); color: #fff; text-align: center; }
  .card { max-width: 360px; }
  img { height: 72px; width: auto; }
  h1 { font-size: 22px; margin: 22px 0 8px; }
  p { margin: 0 0 22px; color: #dbeafe; line-height: 1.5; font-size: 15px; }
  button { appearance: none; border: 0; border-radius: 12px; padding: 12px 22px; font-size: 15px; font-weight: 600;
           background: #c6f432; color: #0a2a5e; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <img src="/brand/joykali-logo-dark.png" alt="Joykali EV Mobility" />
    <h1>You're offline</h1>
    <p>Joykali EV needs the internet to show live stock, sales and attendance. Check your mobile data or Wi-Fi and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
